name: starfish
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.8.0


dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  provider: ^6.1.2
  # 屏幕适配相关
  flutter_screenutil: ^5.9.3
  # 网络请求
  dio: ^5.3.4
  # toast提示
  oktoast: ^3.3.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0


flutter:


  uses-material-design: true

  assets:
    # 声明mock数据资源
    - assets/json/home_banner_data.json
    - assets/json/home_house_data.json
    - assets/json/news_banner_data.json
    - assets/json/news_type_list_data.json
    # 图片资源
    - assets/images/
    # 3D模型资源
    - assets/glb/


